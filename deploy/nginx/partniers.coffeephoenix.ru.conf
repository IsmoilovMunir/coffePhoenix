# Важно: если открываете https://partniers… — нужен второй server с listen 443 ssl и сертификатом.
# Иначе HTTPS попадёт в default_server основного домена и покажет coffee.
# Один раз на сервере: sudo certbot --nginx -d partniers.coffeephoenix.ru
# (скопируйте location /api/ в блок 443, если certbot создал только редирект с 80.)

server {
    listen 80;
    server_name partniers.coffeephoenix.ru;

    root /var/www/coffeephoenix/partniers/dist;
    index index.html;

    # franchise-api (Docker: 127.0.0.1:8080). Без этого POST /api/... попадает в try_files → 405.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
